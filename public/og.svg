    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF6A3D" stop-opacity="0.13" />
      <stop offset="100%" stop-color="#FF6A3D" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cool" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6EE7F9" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#6EE7F9" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#0A0C10" />
  <rect width="1200" height="630" fill="url(#grid)" />
  <ellipse cx="1010" cy="20" rx="480" ry="340" fill="url(#glow)" />
  <ellipse cx="90" cy="600" rx="340" ry="240" fill="url(#cool)" />

  <!-- 图纸页眉 -->
  <g font-family="JetBrains Mono, SF Mono, Menlo, monospace" font-size="13" letter-spacing="3.2" fill="#5B6478">
